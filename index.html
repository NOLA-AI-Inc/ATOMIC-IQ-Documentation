<!DOCTYPE html>
<html lang="en">
  <head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta charset="UTF-8" />
    <title>AtomicIQ Docs</title>
    <meta
      name="description"
      content="AtomicIQ setup, corpus, grounded inference, validation, and local API documentation"
    />
    <link
      rel="stylesheet"
      href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/dark.css"
    />
    <style>
      :root {
        --theme-color: #4f7cff;
      }

      .markdown-section img {
        max-width: 100%;
        height: auto;
        border-radius: 8px;
      }

      .markdown-section table {
        display: table;
        width: 100%;
        color: #e6e6e6;
      }

      .markdown-section table tr {
        background-color: #343434;
      }

      .markdown-section table tr:nth-child(2n) {
        background-color: #454545;
      }

      .markdown-section table th,
      .markdown-section table td {
        border-color: #737373;
      }

      @media (max-width: 720px) {
        .markdown-section table {
          display: block;
          overflow-x: auto;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">Loading documentation...</div>

    <script>
      window.$docsify = {
        name: 'AtomicIQ',
        repo: 'https://github.com/NOLA-AI-Inc/ATOMIC-IQ-Documentation',
        homepage: 'README.md',
        loadSidebar: true,
        loadNavbar: true,
        coverpage: true,
        onlyCover: false,
        subMaxLevel: 2,
        maxLevel: 3,
        auto2top: true,
        executeScript: false,
        relativePath: false,
        alias: {
          '/.*/_sidebar.md': '/_sidebar.md',
          '/.*/_navbar.md': '/_navbar.md'
        },
        search: {
          maxAge: 86400000,
          paths: 'auto',
          placeholder: 'Search docs',
          noData: 'No results found',
          depth: 3
        }
      };
    </script>

    <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/emoji.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/zoom-image.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/docsify-copy-code@2/dist/docsify-copy-code.min.js"></script>
  </body>
</html>
